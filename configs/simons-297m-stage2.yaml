# Simons-297M: synthetic covariate curriculum, warm-started from stage 1.
model:
  context_length: 32768
  prediction_length: 512
  patch_length: 32
  width: 1280
  layers: 13
  heads: 20
  near_context: 4096
  far_pool: 8
  far_min_history: 7680
  stats_window: 8192
  period_slots: 4
  period_alpha: 0.05
  period_local: 5.0
  detector_mid: 7680
  # Covariate roles, fixed-scale indicators and one-way read (simons.covariates).
  covariates: true
  binary_rows: true
  fit_row: false
  past_rows: false
  read_after: 6
  read_binary: true
  xreg: false
training:
  stage: stage1
  steps: 6000
  seed: 11
  checkpoint_every: 2000
  # Checkpoint all blocks; with 4 chunks, 84 rows fit on two 80 GB GPUs.
  checkpoint_blocks: 13
  # Split packed rows into chunks to save memory; gradients differ only by summation order.
  micro_batches: 4
  # LR: constant, 1 - sqrt decay over the last 15% to 0.1 x peak, times a
  # 300-step re-warm from 0.1 (the warm start skips the warmup).
  lr_schedule: wsd
  decay_fraction: 0.15
  decay_shape: sqrt
  final_lr_fraction: 0.1
  muon_lr: 0.002
  adam_lr: 0.0005
  muon_weight_decay: 0.0605
  mup_base_width: 704
  # 84 rows of 32 synthetic series of 8192 + 512 steps per step (over all GPUs).
  synthetic_rows: 84
  synthetic_context: 8192
  synthetic_families: kernel,sarima,sde,step,spike,cauker,rhythm,wave,fpfn,ets,chaos,epi,queue,hydro,thermal,levy,pulse,calendar
  synthetic_family_weights: 0.136864,0.136864,0.078156,0.035828,0.035828,0.052104,0.026052,0.019552,0.019552,0.0442,0.0156,0.0091,0.0091,0.00585,0.00585,0.00975,0.00975,0.35
  synthetic_noise: 0.3
  synthetic_pad: 0.4
  synthetic_pool_steps: 6
  synthetic_augment: mix,season,filter,lattice
  synthetic_augment_rate: 0.4
  synthetic_augment_weights: 0.35,0.25,0.2,0.2
  synthetic_observe: duty
  synthetic_observe_rate: 0.1
  synthetic_observe_duty_periodic: 0.5
  synthetic_multi_fraction: 0.5
  # Per-GPU bank size and refresh interval for two GPUs; scale both by 2 / GPU count.
  mech_bank: 57344
  mech_length: 9216
  mech_refresh: 1400
  mech_refresh_part: 1
  # Load stage 1's weights with a fresh optimizer. Initialize the read with zero writes.
  warm_start: runs/simons-297m-stage1/checkpoint.pt
  rewarm_from: 0.1
  rewarm_steps: 300
  covariate_read_init: variate
  # Role/effect shares per phase; effect_mix orders generic, classical, energy, retail, lagged.
  role_phases: "0.27,0.53"
  role_share: "0.1,0.2,0.4"
  effect_share: "0.01,0.02,0.04"
  effect_mix: "0.125,0.1875,0.5,0.09375,0.09375"
  effect_workers: 4
