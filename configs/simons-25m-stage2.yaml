# Simons-25M: synthetic covariate curriculum, warm-started from stage 1.
model:
  context_length: 32768
  prediction_length: 512
  patch_length: 32
  width: 384
  layers: 12
  heads: 6
  near_context: 4096
  far_pool: 8
  far_min_history: 7680
  stats_window: 8192
  period_slots: 4
  period_alpha: 0.05
  period_local: 5.0
  detector_mid: 7680
  # Covariate roles, fixed-scale indicators and one-way read (simons.covariates).
  covariates: true
  binary_rows: true
  fit_row: false
  past_rows: false
  read_after: 5
  read_binary: true
  xreg: false
training:
  stage: stage1
  steps: 12000
  seed: 11
  checkpoint_every: 4000
  # Constant LR, then 1 - sqrt decay; the warm start applies a re-warm ramp.
  lr_schedule: warmup_decay
  warmup_steps: 1
  decay_steps: 1800
  decay_shape: sqrt
  final_lr_fraction: 0.1
  muon_lr: 0.002
  adam_lr: 0.0005
  muon_weight_decay: 0.02009
  mup_base_width: 704
  # 36 rows of 32 synthetic series of 8192 + 512 steps per step (over all GPUs).
  synthetic_rows: 36
  synthetic_context: 8192
  synthetic_families: kernel,sarima,sde,step,spike,cauker,rhythm,wave,fpfn,ets,chaos,epi,queue,hydro,thermal,levy,pulse
  synthetic_family_weights: 0.21056,0.21056,0.12024,0.05512,0.05512,0.08016,0.04008,0.03008,0.03008,0.068,0.024,0.014,0.014,0.009,0.009,0.015,0.015
  synthetic_noise: 0.3
  synthetic_pad: 0.4
  synthetic_pool_steps: 6
  synthetic_augment: mix,season,filter,lattice
  synthetic_augment_rate: 0.4
  synthetic_augment_weights: 0.35,0.25,0.2,0.2
  synthetic_observe: duty
  synthetic_observe_rate: 0.1
  synthetic_observe_duty_periodic: 0.5
  synthetic_multi_fraction: 0.5
  mech_bank: 16384
  mech_length: 9216
  mech_refresh: 400
  mech_refresh_part: 1
  # Load stage 1's weights with a fresh optimizer. Initialize the read with zero writes.
  warm_start: runs/simons-25m-stage1/checkpoint.pt
  rewarm_from: 0.1
  rewarm_steps: 600
  covariate_read_init: variate
  # Role/effect shares per phase; effect_mix orders generic, classical, energy, retail, lagged.
  role_phases: "0.27,0.53"
  role_share: "0.1,0.2,0.4"
  effect_share: "0.01,0.02,0.04"
  effect_mix: "0.2,0.3,0.2,0.15,0.15"
  effect_workers: 4
