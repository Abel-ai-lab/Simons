# Simons-297M: synthetic pretraining from step 20,240 to 36,000, with a fresh optimizer.
model:
  context_length: 32768
  prediction_length: 512
  patch_length: 32
  width: 1280
  layers: 13
  heads: 20
  near_context: 4096
  far_pool: 8
  far_min_history: 7680
  stats_window: 8192
  period_slots: 4
  period_alpha: 0.05
  period_local: 5.0
  detector_mid: 7680
training:
  stage: stage1
  steps: 36000
  seed: 11
  checkpoint_every: 2000
  # Checkpoint all blocks: about 20 GB per GPU at 12 rows per GPU; trades speed for memory.
  checkpoint_blocks: 13
  # Learning rate: the plan's constant phase, then a linear decay over the last 12% (from step
  # 31,680) to 0.15 x peak; the warm start skips the warmup.
  lr_schedule: wsd
  warmup_fraction: 0.05
  decay_fraction: 0.12
  decay_shape: linear
  final_lr_fraction: 0.15
  muon_lr: 0.002
  adam_lr: 0.0005
  muon_weight_decay: 0.0605
  mup_base_width: 704
  # 84 rows of 32 synthetic series of 8192 + 512 steps per step (over all GPUs).
  synthetic_rows: 84
  synthetic_context: 8192
  synthetic_families: kernel,sarima,sde,step,spike,cauker,rhythm,wave,fpfn,ets,chaos,epi,queue,hydro,thermal,levy,pulse,calendar
  synthetic_family_weights: 0.136864,0.136864,0.078156,0.035828,0.035828,0.052104,0.026052,0.019552,0.019552,0.0442,0.0156,0.0091,0.0091,0.00585,0.00585,0.00975,0.00975,0.35
  synthetic_noise: 0.3
  synthetic_pad: 0.4
  synthetic_pool_steps: 6
  synthetic_augment: mix,season,filter,lattice
  synthetic_augment_rate: 0.4
  synthetic_augment_weights: 0.35,0.25,0.2,0.2
  synthetic_observe: duty
  synthetic_observe_rate: 0.1
  synthetic_observe_duty_periodic: 0.5
  synthetic_multi_fraction: 0.5
  mech_bank: 16384
  mech_length: 9216
  mech_refresh: 400
  mech_refresh_part: 1
  # Load the first leg at step 20,240; restart the optimizer and re-warm over 500 steps.
  warm_start: runs/simons-297m-stage1-leg1/checkpoint.pt
  warm_start_step: 20240
  rewarm_from: 0.15
  rewarm_steps: 500
